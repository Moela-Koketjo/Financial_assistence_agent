[project]
name = "finance-agent-service"
version = "0.1.0"
description = "Finance agent API — Gemini tool-calling agent over MySQL, exposed via FastAPI"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "google-genai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pypdfium2>=5.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
