[project]
name = "finance-dashboard"
version = "0.1.0"
description = "Streamlit dashboard — thin client over the finance agent API"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
