services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-finance123}
      MYSQL_DATABASE: ${DB_NAME:-finance_agent}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-finance123}"]
      interval: 5s
      timeout: 5s
      retries: 12

  agent:
    build: ./agent_service
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-finance123}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-finance_agent}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      API_URL: http://agent:8000
    ports:
      - "8501:8501"
    depends_on:
      - agent

volumes:
  mysql_data:
