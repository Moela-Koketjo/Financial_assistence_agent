services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-finance123}
      MYSQL_DATABASE: ${DB_NAME:-finance_agent}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-finance123}"]
      interval: 5s
      timeout: 5s
      retries: 12

  agent:
    build: ./agent_service
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-finance123}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-finance_agent}
      # Optional overrides, passed through only when set in .env — otherwise the
      # defaults in agent_service/settings.py apply. Lets you switch models
      # (e.g. when one model's daily quota is spent) without a rebuild.
      - PARSE_MODEL
      - CATEGORIZE_MODEL
      - CHAT_MODEL
      - LOG_LEVEL
      # Tracing is off unless both keys are set (agent_service/settings.py).
      # The collector is not part of this stack — see tasks.md TASK-020.
      - LANGFUSE_PUBLIC_KEY
      - LANGFUSE_SECRET_KEY
      - LANGFUSE_HOST
      - LANGFUSE_BASE_URL
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      API_URL: http://agent:8000
    ports:
      - "8501:8501"
    depends_on:
      - agent

volumes:
  mysql_data:
